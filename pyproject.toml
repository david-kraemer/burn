[project]
name = "burn"
version = "0.1.0"
description = "Token burn inspection for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["rich>=13.7"]

[project.scripts]
burn = "burn:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["burn.py"]
