[project]
name = "burn"
version = "0.2.0"
description = "Token burn inspection for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["rich>=13.7"]

[project.scripts]
burn = "burn.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burn"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/burn/__init__.py" = ["F403"]  # re-exports model's public names

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
